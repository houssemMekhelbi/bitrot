# Bitrot tty launcher for fuzzel (unused: SUPER+D runs bitrot-launcher, foot + fzf).

[main]
font=IBM Plex Mono:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="▶ "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=28
layer=overlay
terminal=foot -e

[colors]
background=0A110CFF
text=9CF0A6FF
message=62A66EFF
prompt=33CC55FF
placeholder=62A66EFF
input=9CF0A6FF
match=33CC55FF
selection=16301CFF
selection-text=9CF0A6FF
selection-match=33CC55FF
counter=62A66EFF
border=33CC55FF

[border]
width=1
radius=0
