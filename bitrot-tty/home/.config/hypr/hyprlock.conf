# Bitrot tty lock screen. The wallpaper as it is (no blur, no dimming). Left,
# anchored to the left edge so a wide monitor cannot push anything onto the
# field: the clock, the date, the password field. The clock is the one display
# word that slices, and hyprlock cannot displace a band of a label, so it is an
# image: ~/.local/bin/bitrot-lock-clock renders HH:MM in Sora 700 with a green
# and an amber ghost band and a displaced band, only when the minute changed,
# and prints the PNG's path (reload_cmd). lock-clock.png (the slice without a
# time) shows until the first reload. The field is a 2px frame around the panel
# fill with a ground-coloured gap: two shapes under a transparent input-field
# whose own outline is the frame (structure; amber while verifying, error red
# after a failure). Right: the lock lines (bitrot-lock-saying), the current one
# larger in the secondary colour. No username.
# Positions are for 1920x1080; font_size is in points.

general {
    hide_cursor = true
    immediate_render = true
    fail_timeout = 2500
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.config/hypr/bitrot-tty/wallpaper.png
    color = rgb(050806)
    blur_passes = 0
    brightness = 1.0
    vibrancy = 0
    noise = 0
}

# ---- left: clock, date, field ------------------------------------------------

image {
    monitor =
    path = ~/.config/hypr/bitrot-tty/lock-clock.png
    size = 260
    rounding = 0
    border_size = 0
    reload_time = 10
    reload_cmd = $HOME/.local/bin/bitrot-lock-clock
    position = 140, -130
    halign = left
    valign = top
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] $HOME/.local/bin/bitrot-lock-saying date
    color = rgba(6FBF7CFF)
    font_size = 17
    font_family = IBM Plex Sans
    position = 153, -408
    halign = left
    valign = top
    zindex = 1
}

shape {
    monitor =
    size = 570, 75
    color = rgba(050806FF)
    rounding = 0
    border_size = 0
    position = 153, -500
    halign = left
    valign = top
    zindex = 0
}

shape {
    monitor =
    size = 546, 51
    color = rgba(0A110CFF)
    rounding = 0
    border_size = 0
    position = 165, -512
    halign = left
    valign = top
    zindex = 1
}

input-field {
    monitor =
    size = 570, 75
    outline_thickness = 3
    outer_color = rgba(33CC55FF)
    inner_color = rgba(00000000)
    font_color = rgba(9CF0A6FF)
    font_family = IBM Plex Mono
    check_color = rgba(FFB000FF)
    fail_color = rgba(FF6A55FF)
    capslock_color = rgba(FFB000FF)
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.55
    dots_center = false
    dots_rounding = 0
    fade_on_empty = false
    placeholder_text = <span foreground="##62A66E">password</span>
    check_text = <span foreground="##FFB000">▓▒░ ▓▒░ ▓▒░</span>
    fail_text = <span foreground="##FF6A55">Abort, Retry, Fail?</span>
    position = 153, -500
    halign = left
    valign = top
    zindex = 2
}

# ---- right: the lock lines ------------------------------------------------------

label {
    monitor =
    text = cmd[update:20000] $HOME/.local/bin/bitrot-lock-saying
    color = rgba(62A66EFF)
    font_size = 16
    font_family = IBM Plex Mono
    text_align = right
    position = -135, 135
    halign = right
    valign = bottom
    zindex = 1
}
