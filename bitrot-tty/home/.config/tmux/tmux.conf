# Bitrot tty tmux. Status at the bottom on the panel colour. tmux cannot
# displace a band, so its form of the slice is the smear: a block closes with a
# ▓▒░ fade in its own colour. The session block is reverse video in the
# structure green; windows are plain secondary text, the current one sits on
# the selection fill and closes with the fade; a window with activity gets a ░
# cell after its name. The clock is plain at the far right after a dim ▌, no
# date. Block elements only (IBM Plex Mono has them all), no private-use glyphs.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#0A110C,fg=#6FBF7C"

set -g status-left-length 44
set -g status-left "#[bg=#33CC55,fg=#050806] #{=/24/…:session_name} #[bg=#0A110C,fg=#33CC55]▓▒░ "

set -g status-right-length 20
set -g status-right "#[fg=#62A66E]▌#[fg=#9CF0A6] %H:%M "

set -g window-status-separator ""
set -g window-status-format "#[fg=#6FBF7C] #I:#W#{?window_activity_flag, #[fg=#62A66E]░#[fg=#6FBF7C],} "
set -g window-status-current-format "#[bg=#16301C,fg=#9CF0A6] #I:#W #[bg=#0A110C,fg=#16301C]▓▒░"
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: one cell, the hairline; the active pane's in the structure colour.
set -g pane-border-lines single
set -g pane-border-style "fg=#1e3d26"
set -g pane-active-border-style "fg=#33cc55"
set -g pane-border-indicators off

set -g message-style "bg=#16301C,fg=#9CF0A6"
set -g message-command-style "bg=#16301C,fg=#FFB000"
set -g mode-style "bg=#16301C,fg=#9CF0A6"
set -g copy-mode-match-style "bg=#1E3D26,fg=#9CF0A6"
set -g copy-mode-current-match-style "bg=#FFB000,fg=#050806"
set -g menu-style "bg=#101A13,fg=#9CF0A6"
set -g menu-selected-style "bg=#16301C,fg=#9CF0A6"
set -g menu-border-style "fg=#33CC55"
set -g menu-border-lines single
set -g popup-border-style "fg=#33CC55"
set -g popup-border-lines single
set -g display-panes-colour "#1E3D26"
set -g display-panes-active-colour "#FFB000"
set -g clock-mode-colour "#9CF0A6"
