# Bitrot tty terminal: IBM Plex Mono on the ground colour, opaque (a screen does not
# see through), an amber block cursor with the ink colour under it.
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=IBM Plex Mono:size=10.5
line-height=20
pad=6x6
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=block
blink=no
beam-thickness=2

[colors-dark]
alpha=1.0
background=050806
foreground=9CF0A6
cursor=050806 FFB000
regular0=0A110C
regular1=D9442F
regular2=3FD15A
regular3=FFB000
regular4=5AA0B8
regular5=B57AB0
regular6=5FC9B0
regular7=BFE0BD
bright0=62A66E
bright1=FF6A55
bright2=7DFF8F
bright3=FFD36A
bright4=86C6DC
bright5=D3A0CC
bright6=8AE6D2
bright7=E6F7E3
selection-foreground=9CF0A6
selection-background=16301C
jump-labels=050806 FFB000
scrollback-indicator=050806 33CC55
search-box-no-match=E6F7E3 8C1A12
search-box-match=050806 FFB000
urls=86C6DC

