# Bitrot lp launcher for fuzzel (unused: SUPER+D runs bitrot-launcher, foot + fzf).

[main]
font=IBM Plex Mono:size=10.5,IBM Plex Sans Arabic:size=10.5
use-bold=no
prompt="▶ "
placeholder=search
icons-enabled=yes
match-counter=yes
anchor=center
lines=8
width=90
horizontal-pad=18
vertical-pad=14
inner-pad=10
line-height=28
layer=overlay
terminal=foot -e

[colors]
background=E4EFD9FF
text=1A1F1AFF
message=44614AFF
prompt=2A6334FF
placeholder=44614AFF
input=1A1F1AFF
match=2A6334FF
selection=CFE3C6FF
selection-text=1A1F1AFF
selection-match=2A6334FF
counter=44614AFF
border=2A6334FF

[border]
width=1
radius=0
