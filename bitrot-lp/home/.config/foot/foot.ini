# Bitrot lp terminal: IBM Plex Mono on the ground colour, opaque (a screen does not
# see through), an amber block cursor with the ink colour under it.
# Both colour sections carry the same palette so a light/dark switch keybind
# cannot pull in foot's stock colours.

[main]
font=IBM Plex Mono:size=10.5
line-height=20
pad=6x6
initial-color-theme=dark

[bell]
# A bell in a window without the focus marks it urgent, which the bar's workspace slot shows.
urgent=yes

[cursor]
style=block
blink=no
beam-thickness=2

[colors-dark]
alpha=1.0
background=F4F1E6
foreground=1A1F1A
cursor=F4F1E6 8A5200
regular0=1A1F1A
regular1=A3180F
regular2=2A6334
regular3=8A5200
regular4=205F7A
regular5=6D2F69
regular6=146A5C
regular7=44614A
bright0=4D6B4F
bright1=B8281B
bright2=27773A
bright3=8F5A0A
bright4=225F7A
bright5=8A4A85
bright6=1A7566
bright7=0B0E0B
selection-foreground=1A1F1A
selection-background=CFE3C6
jump-labels=F4F1E6 8A5200
scrollback-indicator=F4F1E6 2A6334
search-box-no-match=F4F1E6 B8281B
search-box-match=F4F1E6 8A5200
urls=225F7A

