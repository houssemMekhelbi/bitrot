# Bitrot lp tmux. Status at the bottom on the panel colour. tmux cannot
# displace a band, so its form of the slice is the smear: a block closes with a
# ▓▒░ fade in its own colour. The session block is reverse video in the
# structure green; windows are plain secondary text, the current one sits on
# the selection fill and closes with the fade; a window with activity gets a ░
# cell after its name. The clock is plain at the far right after a dim ▌, no
# date. Block elements only (IBM Plex Mono has them all), no private-use glyphs.

set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB,alacritty*:RGB,xterm-ghostty:RGB,xterm-256color:RGB"

# One status line in tmux's stock layout. Another theme (Nordschleife) runs two lines with its own
# status-format; a running server keeps those across a theme switch unless they are reset here.
set -g status on
set -gu status-format


set -g status-position bottom
set -g status-interval 15
set -g status-justify left
set -g status-style "bg=#E4EFD9,fg=#2F5233"

set -g status-left-length 44
set -g status-left "#[bg=#2A6334,fg=#F4F1E6] #{=/24/…:session_name} #[bg=#E4EFD9,fg=#2A6334]▓▒░ "

set -g status-right-length 20
set -g status-right "#[fg=#44614A]▌#[fg=#1A1F1A] %H:%M "

set -g window-status-separator ""
set -g window-status-format "#[fg=#2F5233] #I:#W#{?window_activity_flag, #[fg=#44614A]░#[fg=#2F5233],} "
set -g window-status-current-format "#[bg=#CFE3C6,fg=#1A1F1A] #I:#W #[bg=#E4EFD9,fg=#CFE3C6]▓▒░"
set -g window-status-activity-style "none"
set -g monitor-activity on
set -g visual-activity off

# Pane borders: one cell, the hairline; the active pane's in the structure colour.
set -g pane-border-lines single
set -g pane-border-style "fg=#a9c3a4"
set -g pane-active-border-style "fg=#2a6334"
set -g pane-border-indicators off

set -g message-style "bg=#CFE3C6,fg=#1A1F1A"
set -g message-command-style "bg=#CFE3C6,fg=#8A5200"
set -g mode-style "bg=#CFE3C6,fg=#1A1F1A"
set -g copy-mode-match-style "bg=#CFE3C6,fg=#1A1F1A"
set -g copy-mode-current-match-style "bg=#8A5200,fg=#F4F1E6"
set -g menu-style "bg=#FAF8F0,fg=#1A1F1A"
set -g menu-selected-style "bg=#CFE3C6,fg=#1A1F1A"
set -g menu-border-style "fg=#2A6334"
set -g menu-border-lines single
set -g popup-border-style "fg=#2A6334"
set -g popup-border-lines single
set -g display-panes-colour "#A9C3A4"
set -g display-panes-active-colour "#8A5200"
set -g clock-mode-colour "#1A1F1A"
