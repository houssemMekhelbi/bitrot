<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Bitrot type (the same in both variants):
       display    Sora 600/700       + Amiri (Arabic): 24px and up only: lock clock, banner prayer name,
                                       control-centre title
       interface  IBM Plex Sans      + IBM Plex Sans Arabic: GTK 10.5, mawaqit city and prayer, notification titles
       mono       IBM Plex Mono      + IBM Plex Sans Arabic: bar 11px, terminals 10.5, tmux, popups, tooltips
     <accept> puts the companion directly after the Latin face, so only glyphs
     the Latin face lacks use it. IBM Plex Mono has every block element
     (U+2580-259F: ░ ▒ ▓ █ ▌ ▐ ▂ ▆ ▀ ▙ ▟ ▁…█) and the box drawing set, ¶ ± ↔ ↕; it
     lacks ▪ ■ □ ● ▶ ▾ ▴ ◂ ▸ ≡ ⌂, which come from JetBrains Mono Nerd Font, and
     ▮ ⇱ ⇲, which come from DejaVu Sans Mono (it has all of them). -->
<fontconfig>
  <alias binding="same">
    <family>Sora</family>
    <accept><family>Amiri</family></accept>
  </alias>
  <alias binding="same">
    <family>IBM Plex Sans</family>
    <accept><family>IBM Plex Sans Arabic</family><family>JetBrainsMono Nerd Font</family><family>DejaVu Sans Mono</family></accept>
  </alias>
  <alias binding="same">
    <family>IBM Plex Mono</family>
    <accept><family>IBM Plex Sans Arabic</family><family>JetBrainsMono Nerd Font</family><family>DejaVu Sans Mono</family></accept>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
      <family>IBM Plex Sans Arabic</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
      <family>Amiri</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>IBM Plex Mono</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>IBM Plex Sans Arabic</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>
</fontconfig>
